<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="aruaru-db web UI (Rust -> WebAssembly)" />
    <title>aruaru-web</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --bg-raised: #ffffff;
        --fg: #1a1d23;
        --muted: #6b7280;
        --accent: #2f6fed;
        --border: #d9dce1;
        --radius: 0.375rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --bg-raised: #1a1d23;
          --fg: #e6e6e6;
          --muted: #9aa0a6;
          --accent: #4f8cff;
          --border: #2a2d33;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--fg);
      }
      #app-root {
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }
      header h1 { margin: 0 0 0.25rem; letter-spacing: -0.01em; }
      .muted { color: var(--muted); }
      section {
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem 1.1rem;
        margin-top: 1rem;
      }
      label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
      input, textarea {
        display: block;
        width: 100%;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.5rem 0.6rem;
        font: inherit;
      }
      textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; resize: vertical; }
      input:focus, textarea:focus { outline: none; border-color: var(--accent); }
      .buttons { margin-top: 0.75rem; }
      button {
        cursor: pointer;
        background: var(--bg);
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.5rem 1rem;
        margin-right: 0.5rem;
        font: inherit;
        font-weight: 500;
      }
      button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
      #status { font-size: 0.9rem; }
      #result table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
      #result th, #result td {
        border: 1px solid var(--border);
        padding: 0.4rem 0.55rem;
        text-align: left;
      }
      #result th { background: var(--bg); }
      #result .offline {
        background: rgba(217, 119, 6, 0.12);
        border: 1px solid rgba(217, 119, 6, 0.4);
        border-radius: var(--radius);
        padding: 0.6rem 0.75rem;
        font-size: 0.85rem;
      }
      #result .tag { font-size: 0.85rem; color: var(--muted); }
      dl.summary { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0; }
      dl.summary .stat {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.6rem 0.9rem;
        min-width: 6rem;
      }
      dl.summary dt { font-size: 0.75rem; color: var(--muted); margin: 0; }
      dl.summary dd { font-size: 1.4rem; font-weight: 600; margin: 0.15rem 0 0; }
    </style>
  </head>
  <body>
    <main id="app-root">Loading…</main>
    <script type="module">
      import init from "./pkg/aruaru_web.js";
      init();
    </script>
  </body>
</html>
