<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="aruaru-db web UI (Rust -> WebAssembly)" />
    <title>aruaru-web</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --bg-raised: #ffffff;
        --fg: #1a1d23;
        --muted: #6b7280;
        --accent: #2f6fed;
        --border: #d9dce1;
        --radius: 0.375rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --bg-raised: #1a1d23;
          --fg: #e6e6e6;
          --muted: #9aa0a6;
          --accent: #4f8cff;
          --border: #2a2d33;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--fg);
      }
      #app-root {
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }
      header h1 { margin: 0 0 0.25rem; letter-spacing: -0.01em; }
      .muted { color: var(--muted); }
      section {
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem 1.1rem;
        margin-top: 1rem;
      }
      label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
      input, textarea {
        display: block;
        width: 100%;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.5rem 0.6rem;
        font: inherit;
      }
      textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; resize: vertical; }
      input:focus, textarea:focus { outline: none; border-color: var(--accent); }
      .buttons { margin-top: 0.75rem; }
      button {
        cursor: pointer;
        background: var(--bg);
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.5rem 1rem;
        margin-right: 0.5rem;
        font: inherit;
        font-weight: 500;
      }
      button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button:disabled:hover { background: var(--bg); color: var(--accent); border-color: var(--border); }
      #status { font-size: 0.9rem; }
      .hint { font-size: 0.8rem; margin: 0.35rem 0 0; }
      .table-scroll { max-height: 60vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); }
      #result table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
      #result th, #result td {
        border: 1px solid var(--border);
        padding: 0.4rem 0.55rem;
        text-align: left;
      }
      #result th { background: var(--bg); position: sticky; top: 0; }
      #result .offline {
        background: rgba(217, 119, 6, 0.12);
        border: 1px solid rgba(217, 119, 6, 0.4);
        border-radius: var(--radius);
        padding: 0.6rem 0.75rem;
        font-size: 0.85rem;
      }
      #result .tag { font-size: 0.85rem; color: var(--muted); }
      dl.summary { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0; }
      dl.summary .stat {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.6rem 0.9rem;
        min-width: 6rem;
      }
      dl.summary dt { font-size: 0.75rem; color: var(--muted); margin: 0; }
      dl.summary dd { font-size: 1.4rem; font-weight: 600; margin: 0.15rem 0 0; }

      /* タブナビゲーション */
      .tabs {
        display: flex;
        gap: 0.4rem;
        margin-top: 1.25rem;
        border-bottom: 1px solid var(--border);
      }
      .tab-btn {
        margin: 0;
        border: 1px solid transparent;
        border-bottom: none;
        border-radius: var(--radius) var(--radius) 0 0;
        background: transparent;
        color: var(--muted);
        padding: 0.55rem 1rem;
      }
      .tab-btn:hover { background: var(--bg-raised); color: var(--fg); border-color: var(--border); }
      .tab-btn.active {
        background: var(--bg-raised);
        color: var(--accent);
        border-color: var(--border);
        font-weight: 600;
      }
      .tab-panel { display: none; }

      /* サイト管理 */
      .site-card {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.7rem 0.9rem;
        margin-bottom: 0.6rem;
      }
      .site-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
      .site-card-title { font-weight: 600; }
      .badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border-radius: 999px;
        padding: 0.1rem 0.5rem;
        margin-left: 0.4rem;
        vertical-align: middle;
      }
      .site-card-meta, .site-card-stack { font-size: 0.82rem; margin-top: 0.2rem; }
      .site-card-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; flex-shrink: 0; max-width: 14rem; }
      .site-card-actions button { margin: 0; padding: 0.35rem 0.7rem; font-size: 0.85rem; }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem 1rem;
      }
      .form-grid-full { grid-column: 1 / -1; }
      @media (max-width: 560px) {
        .form-grid { grid-template-columns: 1fr; }
      }
      button.secondary { color: var(--muted); }
      section h2 { font-size: 1rem; margin: 0 0 0.5rem; }

      /* クエリ履歴 */
      .history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.3rem; }
      .history-item {
        display: block;
        width: 100%;
        text-align: left;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.82rem;
        font-weight: 400;
        color: var(--fg);
      }
      .history-item:hover { background: var(--bg); color: var(--accent); }

      .test-result { font-size: 0.8rem; align-self: center; }
    </style>
  </head>
  <body>
    <main id="app-root">Loading…</main>
    <script type="module">
      import init from "./pkg/aruaru_web.js";
      init();
    </script>
  </body>
</html>
