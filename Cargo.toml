[workspace]

[package]
name = "aruaru-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["aruaru-web Contributors"]
license = "Apache-2.0"
description = "aruaru-web: KUSANAGI-like deploy/ops tool (IP launch, domain/vhost, automatic HTTPS). Rust compiled to WebAssembly, no Tauri/Node.js/TypeScript build chain."
repository = "https://github.com/aon-co-jp/aruaru-web"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Blob",
    "BlobPropertyBag",
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Node",
    "NodeList",
    "Request",
    "RequestInit",
    "RequestMode",
    "Storage",
    "Url",
    "Window",
]

[profile.release]
opt-level = "s"
lto = true
